# The gates for charly-jetkvm.
#
# This repo is a POSIX shell tool, not a Go plugin, so the stock plugin CI does
# not apply. The rulebook's "tests that can fail" (R7) is satisfied by:
#   - shellcheck + a POSIX syntax check on the installer and the bed, and
#   - an end-to-end run of the installer against a throwaway sshd CONTAINER
#     (the appliance itself is physical and never a CI target).
#
# The container bed performs the REAL release download (gh) and the REAL ssh
# transport; only the remote architecture is a container's.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: POSIX syntax check
        run: |
          sh -n charly-jetkvm
          bash -n tests/run-container-bed.sh
          echo "syntax OK"

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh charly-jetkvm
          shellcheck tests/run-container-bed.sh
          echo "shellcheck OK"

  container-bed:
    runs-on: ubuntu-latest
    needs: shell
    steps:
      - uses: actions/checkout@v7

      - name: End-to-end install against a throwaway sshd container
        env:
          GH_TOKEN: ${{ github.token }}
        run: tests/run-container-bed.sh
